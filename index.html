<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Smart Calculator | Insha Mahfooz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== SPLASH SCREEN STYLES ========== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .splash-content {
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .splash-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .splash-subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        .splash-name {
            font-size: 1.2rem;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }

        .splash-loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin: 30px auto 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .splash-progress {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: 20px auto 0;
            overflow: hidden;
        }

        .splash-progress-bar {
            width: 0%;
            height: 100%;
            background: white;
            border-radius: 10px;
            animation: progress 5s ease forwards;
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* ========== CALCULATOR STYLES ========== */
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --calculator-bg: rgba(255, 255, 255, 0.95);
            --display-bg: #1e293b;
            --display-previous: #94a3b8;
            --display-current: #ffffff;
            --button-bg: #f1f5f9;
            --button-text: #1e293b;
            --operator-bg: #f59e0b;
            --operator-text: white;
            --clear-bg: #ef4444;
            --delete-bg: #64748b;
            --equals-bg: #10b981;
            --percent-bg: #8b5cf6;
            --memory-bg: #3b82f6;
            --history-bg: #ec489a;
            --history-item-bg: #f8fafc;
            --history-text: #1e293b;
            --history-time: #94a3b8;
            --border-color: #e2e8f0;
            --history-panel-bg: rgba(255, 255, 255, 0.98);
        }

        body.dark {
            --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --calculator-bg: rgba(15, 23, 42, 0.95);
            --display-bg: #0a0f1a;
            --display-previous: #64748b;
            --display-current: #e2e8f0;
            --button-bg: #1e293b;
            --button-text: #e2e8f0;
            --operator-bg: #d97706;
            --operator-text: white;
            --clear-bg: #dc2626;
            --delete-bg: #475569;
            --equals-bg: #059669;
            --percent-bg: #7c3aed;
            --memory-bg: #2563eb;
            --history-bg: #db2777;
            --history-item-bg: #334155;
            --history-text: #e2e8f0;
            --history-time: #94a3b8;
            --border-color: #334155;
            --history-panel-bg: rgba(30, 41, 59, 0.98);
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            padding: 20px;
            position: relative;
        }

        /* Main Calculator (Initially Hidden) */
        .calculator {
            background: var(--calculator-bg);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .calculator.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Dark Mode Toggle */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--button-bg);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--button-text);
            z-index: 10;
        }

        .memory-indicator {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--memory-bg);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .memory-indicator.active {
            opacity: 1;
        }

        .display {
            background: var(--display-bg);
            border-radius: 25px;
            padding: 20px;
            margin: 50px 0 20px 0;
        }

        .previous-operand {
            color: var(--display-previous);
            font-size: 0.85rem;
            text-align: right;
            min-height: 22px;
        }

        .current-operand {
            color: var(--display-current);
            font-size: 2.5rem;
            text-align: right;
            font-weight: 700;
            word-wrap: break-word;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            border: none;
            background: var(--button-bg);
            padding: 14px 0;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            color: var(--button-text);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.05s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background: var(--operator-bg);
            color: var(--operator-text);
        }

        .clear {
            background: var(--clear-bg);
            color: white;
        }

        .equals {
            background: var(--equals-bg);
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .delete {
            background: var(--delete-bg);
            color: white;
        }

        .percent {
            background: var(--percent-bg);
            color: white;
        }

        .memory {
            background: var(--memory-bg);
            color: white;
            font-size: 0.9rem;
        }

        .history-toggle {
            background: var(--history-bg);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .zero {
            grid-column: span 2;
        }

        /* History Overlay */
        .history-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .history-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .history-popup {
            background: var(--history-panel-bg);
            border-radius: 40px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            padding: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .history-overlay.show .history-popup {
            transform: scale(1);
        }

        .history-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .history-popup-header h3 {
            color: var(--history-text);
            font-size: 1.2rem;
        }

        .close-history {
            background: var(--delete-bg);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            color: white;
        }

        .clear-history-btn {
            background: var(--clear-bg);
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            margin-bottom: 15px;
            width: 100%;
        }

        .history-list-popup {
            max-height: 50vh;
            overflow-y: auto;
        }

        .history-item {
            background: var(--history-item-bg);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 20px;
            cursor: pointer;
            border-left: 4px solid var(--history-bg);
        }

        .history-calculation {
            font-size: 0.85rem;
            color: var(--history-text);
        }

        .history-result {
            font-size: 1rem;
            font-weight: bold;
            color: var(--equals-bg);
            margin-top: 4px;
        }

        .history-time {
            font-size: 0.6rem;
            color: var(--history-time);
            margin-top: 4px;
        }

        .no-history {
            text-align: center;
            color: var(--history-time);
            padding: 40px;
        }

        @media (max-width: 480px) {
            .calculator { padding: 15px; }
            button { padding: 11px 0; font-size: 1rem; }
            .current-operand { font-size: 2rem; }
            .splash-title { font-size: 1.8rem; }
            .splash-icon { font-size: 3.5rem; }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-icon">🧮</div>
            <div class="splash-title">Smart Calculator</div>
            <div class="splash-subtitle">Premium Edition</div>
            <div class="splash-loader"></div>
            <div class="splash-progress">
                <div class="splash-progress-bar"></div>
            </div>
            <div class="splash-name">✨ Created by Insha Mahfooz ✨</div>
        </div>
    </div>

    <!-- Main Calculator -->
    <div class="calculator" id="calculator">
        <button class="theme-toggle" id="themeToggleBtn">🌙</button>
        <div class="memory-indicator" id="memoryIndicator">M</div>
        
        <div class="display">
            <div class="previous-operand" id="previousDisplay"></div>
            <div class="current-operand" id="currentDisplay">0</div>
        </div>
        
        <div class="buttons">
            <button class="memory" id="memoryClear">MC</button>
            <button class="memory" id="memoryAdd">M+</button>
            <button class="memory" id="memorySubtract">M-</button>
            <button class="memory" id="memoryRecall">MR</button>
            
            <button class="clear" id="clearBtn">AC</button>
            <button class="delete" id="deleteBtn">⌫</button>
            <button class="percent" id="percentBtn">%</button>
            <button class="operator" id="divideBtn">÷</button>
            
            <button class="number" data-num="7">7</button>
            <button class="number" data-num="8">8</button>
            <button class="number" data-num="9">9</button>
            <button class="operator" id="multiplyBtn">×</button>
            
            <button class="number" data-num="4">4</button>
            <button class="number" data-num="5">5</button>
            <button class="number" data-num="6">6</button>
            <button class="operator" id="subtractBtn">−</button>
            
            <button class="number" data-num="1">1</button>
            <button class="number" data-num="2">2</button>
            <button class="number" data-num="3">3</button>
            <button class="operator" id="addBtn">+</button>
            
            <button class="number zero" data-num="0">0</button>
            <button class="number" data-num=".">.</button>
            <button class="history-toggle" id="historyToggleBtn">📜</button>
            <button class="equals" id="equalsBtn">=</button>
        </div>
    </div>

    <!-- History Overlay -->
    <div class="history-overlay" id="historyOverlay">
        <div class="history-popup">
            <div class="history-popup-header">
                <h3> Calculation History</h3>
                <button class="close-history" id="closeHistoryBtn">*</button>
            </div>
            <button class="clear-history-btn" id="clearHistoryBtn">🗑️ Clear All</button>
            <div class="history-list-popup" id="historyListPopup">
                <div class="no-history">No calculations yet</div>
            </div>
        </div>
    </div>

    <script>
        // ========== SPLASH SCREEN LOGIC ==========
        setTimeout(function() {
            const splash = document.getElementById('splashScreen');
            const calculator = document.getElementById('calculator');
            
            splash.classList.add('hide');
            calculator.classList.add('show');
            
            // Remove splash from DOM after animation
            setTimeout(function() {
                splash.style.display = 'none';
            }, 500);
        }, 5000); // 5 seconds splash screen
        
        // ========== HISTORY FUNCTIONS ==========
        let history = [];
        const MAX_HISTORY = 20;
        
        function loadHistory() {
            const saved = localStorage.getItem('calculatorHistory');
            if (saved) {
                history = JSON.parse(saved);
                renderHistory();
            }
        }
        
        function saveHistory() {
            localStorage.setItem('calculatorHistory', JSON.stringify(history));
        }
        
        function addToHistory(expression, result) {
            history.unshift({
                id: Date.now(),
                expression: expression,
                result: result,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                date: new Date().toLocaleDateString()
            });
            if (history.length > MAX_HISTORY) history.pop();
            saveHistory();
            renderHistory();
        }
        
        function renderHistory() {
            const historyList = document.getElementById('historyListPopup');
            if (history.length === 0) {
                historyList.innerHTML = '<div class="no-history">📭 No calculations yet</div>';
                return;
            }
            historyList.innerHTML = history.map(item => `
                <div class="history-item" onclick="recallCalculation('${item.result}')">
                    <div class="history-calculation">${item.expression}</div>
                    <div class="history-result">= ${item.result}</div>
                    <div class="history-time">${item.date} • ${item.time}</div>
                </div>
            `).join('');
        }
        
        function recallCalculation(result) {
            currentNumber = result;
            previousNumber = '';
            operation = null;
            waitingForNewNumber = true;
            updateDisplay();
            closeHistoryPopup();
        }
        
        function clearHistory() {
            if (confirm('Delete all history?')) {
                history = [];
                saveHistory();
                renderHistory();
            }
        }
        
        function openHistoryPopup() {
            document.getElementById('historyOverlay').classList.add('show');
        }
        
        function closeHistoryPopup() {
            document.getElementById('historyOverlay').classList.remove('show');
        }
        
        // ========== DARK MODE ==========
        const themeToggle = document.getElementById('themeToggleBtn');
        let isDark = localStorage.getItem('darkMode') === 'true';
        
        function applyTheme() {
            if (isDark) {
                document.body.classList.add('dark');
                themeToggle.textContent = '☀️';
            } else {
                document.body.classList.remove('dark');
                themeToggle.textContent = '🌙';
            }
        }
        
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            localStorage.setItem('darkMode', isDark);
            applyTheme();
        });
        applyTheme();
        
        // ========== MEMORY ==========
        let memory = 0;
        const memoryIndicator = document.getElementById('memoryIndicator');
        
        function updateMemoryIndicator() {
            memoryIndicator.classList.toggle('active', memory !== 0);
        }
        
        // ========== CALCULATOR CORE ==========
        const previousDisplay = document.getElementById('previousDisplay');
        const currentDisplay = document.getElementById('currentDisplay');
        
        let currentNumber = '0';
        let previousNumber = '';
        let operation = null;
        let waitingForNewNumber = false;
        
        function updateDisplay() {
            currentDisplay.textContent = currentNumber;
            if (previousNumber && operation) {
                previousDisplay.textContent = `${previousNumber} ${getSymbol(operation)}`;
            } else {
                previousDisplay.textContent = previousNumber || '';
            }
        }
        
        function getSymbol(op) {
            const symbols = { '+': '+', '-': '−', '×': '×', '÷': '÷' };
            return symbols[op] || op;
        }
        
        function addNumber(num) {
            if (waitingForNewNumber) {
                currentNumber = num;
                waitingForNewNumber = false;
            } else {
                if (num === '.' && currentNumber.includes('.')) return;
                if (currentNumber === '0' && num !== '.') {
                    currentNumber = num;
                } else {
                    if (currentNumber.length < 16) currentNumber += num;
                }
            }
            updateDisplay();
        }
        
        function clearAll() {
            currentNumber = '0';
            previousNumber = '';
            operation = null;
            waitingForNewNumber = false;
            updateDisplay();
        }
        
        function deleteLast() {
            if (waitingForNewNumber) return;
            if (currentNumber.length === 1) {
                currentNumber = '0';
            } else {
                currentNumber = currentNumber.slice(0, -1);
                if (currentNumber === '') currentNumber = '0';
            }
            updateDisplay();
        }
        
        function percentage() {
            let num = parseFloat(currentNumber);
            if (isNaN(num)) return;
            currentNumber = (num / 100).toString();
            waitingForNewNumber = false;
            updateDisplay();
        }
        
        function calculate() {
            if (!operation || !previousNumber || waitingForNewNumber) return;
            const prev = parseFloat(previousNumber);
            const curr = parseFloat(currentNumber);
            if (isNaN(prev) || isNaN(curr)) return;
            let result;
            switch(operation) {
                case '+': result = prev + curr; break;
                case '-': result = prev - curr; break;
                case '×': result = prev * curr; break;
                case '÷':
                    if (curr === 0) { alert("Cannot divide by zero!"); clearAll(); return; }
                    result = prev / curr; break;
                default: return;
            }
            result = parseFloat(result.toFixed(10));
            const expression = `${previousNumber} ${getSymbol(operation)} ${currentNumber}`;
            currentNumber = result.toString();
            previousNumber = '';
            operation = null;
            waitingForNewNumber = true;
            updateDisplay();
            addToHistory(expression, result.toString());
        }
        
        function setOperation(op) {
            if (operation && !waitingForNewNumber && previousNumber) calculate();
            if (currentNumber === '') return;
            operation = op;
            previousNumber = currentNumber;
            waitingForNewNumber = true;
            updateDisplay();
        }
        
        function handleEquals() {
            if (!operation || waitingForNewNumber) return;
            calculate();
        }
        
        // Event Listeners
        document.querySelectorAll('.number').forEach(btn => {
            btn.addEventListener('click', () => addNumber(btn.getAttribute('data-num')));
        });
        document.getElementById('memoryClear').addEventListener('click', () => { memory = 0; updateMemoryIndicator(); });
        document.getElementById('memoryAdd').addEventListener('click', () => { let v = parseFloat(currentNumber); if (!isNaN(v)) { memory += v; updateMemoryIndicator(); } });
        document.getElementById('memorySubtract').addEventListener('click', () => { let v = parseFloat(currentNumber); if (!isNaN(v)) { memory -= v; updateMemoryIndicator(); } });
        document.getElementById('memoryRecall').addEventListener('click', () => { currentNumber = memory.toString(); waitingForNewNumber = true; updateDisplay(); });
        document.getElementById('clearBtn').addEventListener('click', clearAll);
        document.getElementById('deleteBtn').addEventListener('click', deleteLast);
        document.getElementById('percentBtn').addEventListener('click', percentage);
        document.getElementById('addBtn').addEventListener('click', () => setOperation('+'));
        document.getElementById('subtractBtn').addEventListener('click', () => setOperation('-'));
        document.getElementById('multiplyBtn').addEventListener('click', () => setOperation('×'));
        document.getElementById('divideBtn').addEventListener('click', () => setOperation('÷'));
        document.getElementById('equalsBtn').addEventListener('click', handleEquals);
        document.getElementById('historyToggleBtn').addEventListener('click', openHistoryPopup);
        document.getElementById('closeHistoryBtn').addEventListener('click', closeHistoryPopup);
        document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
        
        document.getElementById('historyOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('historyOverlay')) closeHistoryPopup();
        });
        
        window.recallCalculation = recallCalculation;
        
        loadHistory();
        updateDisplay();
        updateMemoryIndicator();
    </script>
</body>
</html>
